services:
  postgres:
    image: postgres:16-alpine
    container_name: undangan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-undangan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-undangan}
      POSTGRES_DB: ${POSTGRES_DB:-undangan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-undangan} -d ${POSTGRES_DB:-undangan}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - undangan-net

  minio:
    image: minio/minio:latest
    container_name: undangan-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-undangan_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-undangan_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - undangan-net

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile.dev
    container_name: undangan-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../apps/backend:/app
      # named volume terpisah supaya cache registry & hasil compile tidak lenyap
      # tiap kali container di-recreate (hindari compile ulang semua deps dari nol)
      - backend_cargo_registry:/usr/local/cargo/registry
      - backend_target:/app/target
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-undangan}:${POSTGRES_PASSWORD:-undangan}@postgres:5432/${POSTGRES_DB:-undangan}
      SERVER_PORT: 8080
      RUST_LOG: info
      # endpoint internal (nama service Docker) dipakai backend untuk connect ke MinIO
      MINIO_ENDPOINT: http://minio:9000
      # base URL publik yang bisa diakses browser untuk menampilkan foto ter-upload
      MINIO_PUBLIC_URL: http://localhost:${MINIO_API_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-undangan_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-undangan_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-undangan-assets}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD harus di-set di .env}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - undangan-net

  frontend:
    image: node:22-alpine
    container_name: undangan-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ../apps/frontend:/app
      # named volume terpisah supaya node_modules tidak "hilang" ketimpa bind
      # mount host (yang tidak punya node_modules) dan tetap ter-cache antar restart
      - frontend_node_modules:/app/node_modules
    environment:
      # dipakai vite.config.js (Node context) untuk proxy /api, BUKAN diekspos ke
      # browser -- makanya sengaja tidak diberi prefix VITE_
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - undangan-net

  # Membuat bucket default & policy publik untuk asset (foto, lagu) sekali saat startup
  minio-init:
    image: minio/mc:latest
    container_name: undangan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-undangan_admin} ${MINIO_ROOT_PASSWORD:-undangan_secret};
      mc mb --ignore-existing local/${MINIO_BUCKET:-undangan-assets};
      mc anonymous set download local/${MINIO_BUCKET:-undangan-assets};
      exit 0;
      "
    networks:
      - undangan-net

networks:
  undangan-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  backend_cargo_registry:
  backend_target:
  frontend_node_modules:
